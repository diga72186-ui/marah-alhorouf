<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إعداد حساب المدير - مرح الحروف</title>
<style>
body{font-family:system-ui,Arial,sans-serif;background:#f4f6fb;margin:0;padding:20px;color:#182033}
main{max-width:480px;margin:30px auto;background:white;padding:22px;border-radius:16px;box-shadow:0 5px 24px #0001}
h2{margin-top:0}label{display:block;margin:14px 0 6px;font-weight:600}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd2df;border-radius:9px;font-size:16px}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:#2457d6;color:white;font-size:17px;font-weight:700}#msg{margin-top:15px;line-height:1.7;white-space:pre-wrap}.hint{font-size:13px;color:#596579}
</style>
</head>
<body>
<main>
<h2>إنشاء حساب المدير</h2>
<p class="hint">استخدم الصفحة مرة واحدة فقط لإنشاء أول حساب مدير. لا تشارك كلمة السر السرية مع أي شخص.</p>
<form id="f">
<label for="username">اسم المستخدم</label><input id="username" required maxlength="40" autocomplete="username">
<label for="displayName">اسم المدير الظاهر</label><input id="displayName" required maxlength="80">
<label for="password">كلمة مرور المدير (10 أحرف على الأقل)</label><input id="password" type="password" required minlength="10" maxlength="100" autocomplete="new-password">
<label for="secret">القيمة السرية BOOTSTRAP_SECRET</label><input id="secret" type="password" required autocomplete="off">
<button id="submit" type="submit">إنشاء حساب المدير</button>
</form>
<div id="msg" role="status"></div>
</main>
<script>
const API='https://plain-math-8d3d.diga72186.workers.dev/api/setup-admin';
const form=document.getElementById('f'),msg=document.getElementById('msg'),btn=document.getElementById('submit');
form.addEventListener('submit',async e=>{
 e.preventDefault();btn.disabled=true;btn.textContent='جاري الإنشاء...';msg.textContent='';
 const payload={username:document.getElementById('username').value.trim(),displayName:document.getElementById('displayName').value.trim(),password:document.getElementById('password').value,secret:document.getElementById('secret').value};
 try{
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const d=await r.json();
  if(r.ok&&d.success){msg.textContent='تم إنشاء حساب المدير بنجاح. احذف ملف setup-admin.html من GitHub الآن، ثم نربط صفحة تسجيل الدخول.';form.reset();}
  else{msg.textContent='لم يتم الإنشاء: '+(d.error||('HTTP '+r.status));}
 }catch(err){msg.textContent='تعذر الاتصال. تأكد أن الصفحة مرفوعة على GitHub Pages وأن الإنترنت يعمل.';}
 btn.disabled=false;btn.textContent='إنشاء حساب المدير';
});
</script>
</body>
</html>
